# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build and Test

on:
  workflow_call:
  push:
    branches-ignore:
      - main
  pull_request:
    branches: ["main"]
  release:
  workflow_dispatch:

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Format
      run:  go fmt ./...

    - name: Lint
      run:  go vet ./...
      
    - name: Build
      run:  go build -race -o evcc-prometheus ./cmd

    - name: Test
      run: go test -v ./... -coverprofile=/tmp/coverage.out

    - name: Test (race)
      run: go test -race -v ./... -coverprofile=/tmp/coverage-race.out
      
    - name: Create coverage report
      run: go tool cover -html=/tmp/coverage.out -o /tmp/coverage.html

    - name: Create coverage report (race)
      run: go tool cover -html=/tmp/coverage-race.out -o /tmp/coverage-race.html

    - name: Upload coverage report html
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: |
          /tmp/coverage.html
          /tmp/coverage-race.html
        retention-days: 14

          
